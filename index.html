<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL2QR - 스마트 QR코드 생성기</title>
  <meta name="description" content="URL을 입력하여 손쉽게 고해상도 QR코드를 생성하고 PNG, JPG 파일로 다운로드하세요. Light/Dark 모드 및 다국어를 지원합니다." />
  <link rel="icon" type="image/png" href="images/logo.png" />
  
  <!-- Modern Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Top Header Bar -->
    <header class="app-header">
      <!-- Left: Logo -->
      <a href="#" class="logo-container" id="brandLogo" title="URL2QR 홈">
        <img src="images/logo.png" alt="URL2QR 로고" class="logo-image" />
        <span class="logo-badge">QR Studio</span>
      </a>

      <!-- Right: Controls (Language Selector & Theme Toggle) -->
      <div class="header-controls">
        <!-- Language Switcher -->
        <nav class="lang-selector-group" aria-label="언어 선택">
          <button type="button" class="lang-btn active" data-lang="ko" id="btnLangKo">한글</button>
          <button type="button" class="lang-btn" data-lang="en" id="btnLangEn">English</button>
          <button type="button" class="lang-btn" data-lang="zh" id="btnLangZh">中文</button>
          <button type="button" class="lang-btn" data-lang="ja" id="btnLangJa">日本語</button>
        </nav>

        <!-- Light/Dark Mode Switcher -->
        <button type="button" class="theme-toggle-btn" id="themeToggle" aria-label="테마 전환" title="다크 모드로 전환">
          <!-- Populated by JavaScript with Sun/Moon SVG -->
        </button>
      </div>
    </header>

    <!-- Main Content Stage -->
    <main class="main-content">
      <div class="interaction-hub" id="interactionHub">
        
        <!-- Guidance Notice (Displayed Above URL Input) -->
        <div class="guidance-box" id="guidanceBox">
          <h1 class="guidance-title" id="guidanceTitle">
            <span class="guidance-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path>
              </svg>
            </span>
            <span id="guidanceText">URL을 입력한 후 확인 버튼을 누르면 QR코드가 생성됩니다</span>
          </h1>
        </div>

        <!-- QR Code Display Area (Smoothly appears in center once generated) -->
        <section class="qr-display-container" id="qrDisplayContainer" aria-label="생성된 QR코드 영역">
          <!-- Interactive QR Card -->
          <div class="qr-card-wrapper" id="qrCardWrapper" role="button" tabindex="0" title="클릭하여 다운로드">
            <div id="qrcode"></div>
            <div class="qr-hover-overlay">
              <svg class="qr-hover-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span class="qr-hover-text" id="qrHoverText">클릭하여 다운로드</span>
            </div>
          </div>

          <!-- Format & Action Controls -->
          <div class="qr-action-panel">
            <!-- Format Selector (PNG / JPG / SVG) -->
            <div class="format-toggle-group" role="group" aria-label="파일 포맷 선택">
              <button type="button" class="format-btn active" data-format="png" id="formatPng">PNG</button>
              <button type="button" class="format-btn" data-format="jpg" id="formatJpg">JPG</button>
              <button type="button" class="format-btn" data-format="svg" id="formatSvg">SVG</button>
            </div>

            <!-- Save / Download Button -->
            <button type="button" class="btn-save-qr" id="btnSave" aria-label="QR코드 저장하기">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span id="btnSaveText">저장하기</span>
            </button>

            <!-- Copy URL Button -->
            <button type="button" class="btn-utility" id="btnCopy" aria-label="URL 복사하기">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span id="btnCopyText">URL 복사</span>
            </button>

            <!-- New / Reset Button -->
            <button type="button" class="btn-utility" id="btnReset" aria-label="새로 만들기">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
              </svg>
              <span id="btnResetText">새로 만들기</span>
            </button>
          </div>
        </section>

        <!-- URL Input Section (Initial State: Centered; Generated State: Moves gracefully below QR) -->
        <section class="input-section" aria-label="URL 입력 영역">
          <div class="input-card">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <input 
              type="url" 
              id="urlInput" 
              class="url-input" 
              placeholder="https://example.com 또는 웹사이트 주소를 입력하세요" 
              autocomplete="off" 
              spellcheck="false" 
              aria-label="생성할 URL 주소" 
            />
            
            <div class="input-actions">
              <button type="button" id="clearInput" class="btn-action-icon" title="지우기" aria-label="입력 내용 지우기">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
              <button type="button" id="pasteInput" class="btn-action-icon" title="클립보드 붙여넣기" aria-label="클립보드 붙여넣기">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                  <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                </svg>
              </button>
            </div>

            <button type="button" id="btnConfirm" class="btn-confirm" aria-label="QR코드 생성 확인">
              <span id="btnConfirmText">확인</span>
              <svg class="btn-confirm-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>

          <!-- Quick URL Suggestions -->
          <div class="suggestions-bar">
            <span class="chip-label" id="chipLabel">추천 예시:</span>
            <button type="button" class="url-chip" data-url="https://www.google.com">Google</button>
            <button type="button" class="url-chip" data-url="https://www.naver.com">Naver</button>
            <button type="button" class="url-chip" data-url="https://www.youtube.com">YouTube</button>
            <button type="button" class="url-chip" data-url="https://github.com">GitHub</button>
          </div>
        </section>

      </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast-container" role="status" aria-live="polite">
      <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span id="toastText"></span>
    </div>

    <!-- Footer with Copyright -->
    <footer class="app-footer">
      <p class="copyright-text">
        <span>Copyright Ⓒ 2026 KIM JOSEPH,</span>
        <a href="mailto:joseph@kakao.com" class="copyright-email">joseph@kakao.com</a>
      </p>
    </footer>
  </div>

  <!-- QR Code Library (Local Standalone) -->
  <script src="js/qrcode.min.js"></script>
  <!-- Application Script -->
  <script src="js/app.js"></script>
</body>
</html>
